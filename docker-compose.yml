# One-command local stack: Postgres, Redis, Elasticsearch, backend API, enrichment worker, frontend.
# Mock mode works without any provider keys. Add keys via Admin -> Settings (encrypted at rest) or .env.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shoescout
      POSTGRES_PASSWORD: shoescout
      POSTGRES_DB: shoescout
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U shoescout"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ["9200:9200"]
    healthcheck: { test: ["CMD-SHELL", "curl -fs http://localhost:9200 >/dev/null"], interval: 10s, retries: 20 }

  backend:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://shoescout:shoescout@postgres:5432/shoescout
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      FRONTEND_ORIGIN: http://localhost:3000
      RUN_WORKER: "false"
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./backend
    command: ["python", "-m", "scripts.worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://shoescout:shoescout@postgres:5432/shoescout
      REDIS_URL: redis://redis:6379/0
      ELASTICSEARCH_URL: http://elasticsearch:9200
      SEED_ON_STARTUP: "false"
    depends_on:
      backend: { condition: service_started }

  frontend:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_BASE: http://localhost:8000 }
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata: {}
